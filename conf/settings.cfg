# Bear & Moose CA public, non-secret settings.
# This file uses shell-compatible KEY="value" assignments so management
# scripts can load it without requiring an additional configuration parser.

PROJECT_NAME="Bear & Moose CA"
PROJECT_VERSION="0.2.42"

STEP_CLI_VERSION="0.30.6"
STEP_CA_VERSION="0.30.2"
DEBIAN_VERSION="13"

DEV_CA_HOST="sally"
DEV_CA_NAME="devca.osoyalce.com"
DEV_CA_DNS_TARGET="sally.osoyalce.com"
DEV_CA_ADDRESS="192.168.0.86"

PROD_CA_HOST="paris"
PROD_CA_NAME="ca.osoyalce.com"
PROD_CA_DNS_TARGET="paris.osoyalce.com"
PROD_CA_ADDRESS="192.168.0.27"

# Installation paths
# SOURCE_DIR is the Git checkout. INSTALL_DIR contains the installed, released
# bmca scripts and public assets; it must not contain live CA state or keys.
SOURCE_DIR="/root/bmca"
INSTALL_DIR="/opt/bmca"
INSTALL_SCRIPTS_DIR="/opt/bmca/scripts"
INSTALL_CONF_DIR="/opt/bmca/conf"
INSTALL_SYSTEMD_DIR="/opt/bmca/systemd"
INSTALL_TEMPLATES_DIR="/opt/bmca/templates"
BMCA_CONFIG_DIR="/etc/bmca"
BMCA_STATE_DIR="/var/lib/bmca"

# Smallstep paths
STEP_CLI_BIN="/usr/bin/step"
STEP_CA_BIN="/usr/bin/step-ca"
STEP_CA_CONFIG_DIR="/etc/step-ca"
STEP_CA_CONFIG_FILE="/etc/step-ca/ca.json"
STEP_CA_STATE_DIR="/var/lib/step-ca"
STEP_CA_CERTS_DIR="/var/lib/step-ca/certs"
STEP_CA_SECRETS_DIR="/var/lib/step-ca/secrets"
STEP_CA_DB_DIR="/var/lib/step-ca/db"
STEP_CA_USER="step-ca"
STEP_CA_GROUP="step-ca"
STEP_CA_LISTEN_ADDRESS=":9000"
STEP_CA_PORT="9000"
STEP_CA_PASSWORD_FILE="/etc/step-ca/intermediate-password"
# Root-only source used during initialization/import; mode must be 0600. Import
# copies it to STEP_CA_PASSWORD_FILE as root:step-ca mode 0640 for the service.
CA_PASSWORD_FILE="/root/.bmca"
STEP_CA_HEALTH_PATH="/health"
STEP_CA_HEALTH_RETRIES="10"
STEP_CA_HEALTH_RETRY_DELAY="1"
STEP_CA_PROVISIONER="bmca-admin"
STEP_CA_WEB_PROVISIONER="bmca-web-server"
STEP_CA_DB_SERVER_PROVISIONER="bmca-db-server"
STEP_CA_DB_REPLICATION_PROVISIONER="bmca-db-replication"
STEP_CA_DB_APPLICATION_PROVISIONER="bmca-db-application"
STEP_CA_DB_ADMIN_PROVISIONER="bmca-db-admin"
X509_MIN_LIFETIME="5m"
X509_DEFAULT_LIFETIME="24h"
X509_MAX_LIFETIME="168h"
INTERMEDIATE_CA_LIFETIME="43800h"
SSH_HOST_DEFAULT_LIFETIME="720h"
SSH_USER_DEFAULT_LIFETIME="8h"
INTERMEDIATE_ROTATION_DIR="$BMCA_STATE_DIR/intermediate-rotation"

# Service installation paths
SYSTEMD_SOURCE_FILE="/opt/bmca/systemd/step-ca.service"
SYSTEMD_UNIT_FILE="/etc/systemd/system/step-ca.service"

# Backup paths
# BACKUP_LINK is a symlink created by the installer. BACKUP_NFS_MOUNT must be
# an NFS mount, and the environment-specific target directories must contain
# encrypted backup archives only. Live CA state must never be read from or
# written directly to NFS. Development and production backups remain separate.
BACKUP_LINK="/opt/bmca/backups"
BACKUP_NFS_MOUNT="/imports/disk1/backups/bmca"
DEV_BACKUP_TARGET_DIR="/imports/disk1/backups/bmca/dev"
PROD_BACKUP_TARGET_DIR="/imports/disk1/backups/bmca/prod"
BACKUP_PASSPHRASE_FILE="/etc/bmca/backup-passphrase"
BACKUP_WORK_DIR="$BMCA_STATE_DIR/backup-work"
